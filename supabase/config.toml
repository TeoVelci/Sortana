[functions.trigger-export]
enabled = true
verify_jwt = false
import_map = "./functions/trigger-export/deno.json"
entrypoint = "./functions/trigger-export/index.ts"

[functions.check-export-status]
enabled = true
verify_jwt = true
import_map = "./functions/check-export-status/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/check-export-status/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
